name: App de Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      # Para publicar el APK como release en main
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk tm-companion.apk
      # La app instalada compara este número con el suyo (versionCode) para avisar que hay una nueva
      - run: |
          echo "{\"build\": $GITHUB_RUN_NUMBER}" > version.json
      - uses: actions/upload-artifact@v4
        with:
          name: tm-companion-apk
          path: tm-companion.apk
      # En main: el APK queda siempre en el mismo lugar para bajarlo desde el celular
      - name: Publicar en Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android tm-companion.apk version.json \
            --target "$GITHUB_SHA" \
            --title "App de Android (última versión)" \
            --notes "APK de prueba generado desde main (build $GITHUB_RUN_NUMBER). Abrí este link desde el celular, bajá tm-companion.apk e instalalo. Cada versión nueva se instala encima de la anterior sin perder las partidas."
